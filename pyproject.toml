[project]
name = "watch-sqlite-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.91",
    "pyarrow>=25.0.1",
]

[project.scripts]
watch-sqlite-extractor = "watch_sqlite_extractor:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
]
